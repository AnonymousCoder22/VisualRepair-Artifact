<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chart.js Getting Started</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: sans-serif;
    }

    .chart-container {
      width: 800px;
      max-width: 100%;
      margin: 0 auto;
    }

    .chart-source {
      display: none;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <canvas id="myChart"></canvas>
  </div>
  <pre class="chart-source"><code id="chart-config-source" class="language-javascript">{
  type: 'bar',
  data: {
    labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
    datasets: [{
      label: '# of Votes',
      data: [12, 19, 3, 5, 2, 3],
      borderWidth: 1
    }]
  },
  options: {
    scales: {
      y: {
        beginAtZero: true
      }
    }
  }
}</code></pre>

  <script src="./dist/chart.umd.js"></script>
  <script>
    const ctx = document.getElementById('myChart');
    const configSource = document.getElementById('chart-config-source');
    const rawChartSource = configSource ? configSource.textContent.trim() : '';

    if (rawChartSource) {
      if (/new\s+Chart\s*\(/i.test(rawChartSource) || /\bChart\s*\(/.test(rawChartSource)) {
        new Function('Chart', 'ctx', rawChartSource)(Chart, ctx);
      } else {
        const config = new Function(`return (${rawChartSource});`)();
        new Chart(ctx, config);
      }
    }
  </script>
</body>
</html>
