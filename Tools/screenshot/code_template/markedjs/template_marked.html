<html>
<head>
  <meta charset="utf-8"/>
  <title>Marked in the browser</title>
</head>
<body>
  <div id="content"></div>
  <pre hidden><code id="markdown-source" class="language-markdown">- test
- test
- test
1. test
2. test
3. test</code></pre>
  <script src="./lib/marked.js"></script>
  <script>
    const markdownSource = document.getElementById('markdown-source');
    document.getElementById('content').innerHTML =
      marked.parse(markdownSource ? markdownSource.textContent : '');
  </script>
</body>
</html>
